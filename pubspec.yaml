name: safescan
description: SafeScan – Smart Emergency QR Safety Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  font_awesome_flutter: ^10.7.0
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  # State management
  provider: ^6.1.2
  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  # QR scanning
  mobile_scanner: ^6.0.0
  # Google Sign-In
  google_sign_in: ^6.2.1
  # Save/print QR codes
  gal: ^2.3.0
  printing: ^5.13.1
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
